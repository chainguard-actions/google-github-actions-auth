name: Test - WIF without OIDC token (should fail with OIDC warning)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: auth
        uses: .
        continue-on-error: true
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          service_account: 'test-sa@my-project.iam.gserviceaccount.com'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
        # ACTIONS_ID_TOKEN_REQUEST_TOKEN and ACTIONS_ID_TOKEN_REQUEST_URL are
        # not set in act, so the action should fail with the OIDC warning

      - name: Assert action failed due to missing OIDC token
        run: |
          echo "outcome: ${{ steps.auth.outcome }}"
          if [ "${{ steps.auth.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC token env vars are not set"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC token env vars are not set"
