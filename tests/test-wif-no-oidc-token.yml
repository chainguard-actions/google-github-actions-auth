name: Test workload identity without OIDC token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          service_account: 'my-sa@my-project.iam.gserviceaccount.com'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
        continue-on-error: true
      - name: Assert action failed due to missing OIDC token
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when OIDC token env vars are not set"
            exit 1
          fi
          echo "PASS: action correctly failed when OIDC token env vars are missing"
