name: Test mutually exclusive inputs fail gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          service_account: 'my-sa@my-project.iam.gserviceaccount.com'
          credentials_json: '{"type":"service_account","project_id":"my-project"}'
          create_credentials_file: 'false'
          export_environment_variables: 'false'

      - name: Assert action failed gracefully when both auth methods are provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when mutually exclusive inputs are both provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed when both workload_identity_provider and credentials_json are provided"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
