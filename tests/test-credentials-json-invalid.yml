name: Test - Invalid credentials_json (should fail on auth, not on input validation)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: auth
        uses: .
        continue-on-error: true
        with:
          credentials_json: '{"type":"service_account","project_id":"my-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABxGKqKNRtPkyxAFsxnk\nfake\n-----END RSA PRIVATE KEY-----\n","client_email":"test@my-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
          token_format: ''

      - name: Assert action failed (invalid credentials cause auth failure)
        run: |
          echo "outcome: ${{ steps.auth.outcome }}"
          if [ "${{ steps.auth.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials_json"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials_json"
