name: Test deprecated inputs and project_id coverage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with project_id, request_reason, and deprecated retry inputs
        id: auth
        uses: .
        continue-on-error: true
        with:
          credentials_json: '{"type":"service_account","project_id":"my-test-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABxGKqKNRtPkyxAFsxnk\nfake\n-----END RSA PRIVATE KEY-----\n","client_email":"test@my-test-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          project_id: 'my-test-project'
          request_reason: 'automated-test'
          retries: '3'
          backoff: '250'
          backoff_limit: '32000'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
          token_format: ''

      - name: Assert action failed (invalid credentials cause auth failure)
        env:
          OUTCOME: ${{ steps.auth.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials_json"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials, confirming inputs were accepted"
