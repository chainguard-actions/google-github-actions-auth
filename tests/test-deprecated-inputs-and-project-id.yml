name: Test deprecated inputs and project_id coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-gcp-project
          credentials_json: '{"type":"service_account"}'
          request_reason: 'test-run'
          retries: '3'
          backoff: '250'
          backoff_limit: '32000'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
      - name: Assert action failed as expected (no valid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid/incomplete credentials"
