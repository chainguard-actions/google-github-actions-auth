name: Test workload identity provider auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          service_account: 'test-sa@my-test-project.iam.gserviceaccount.com'
          project_id: 'my-test-project'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
          token_format: ''
      - name: Assert action ran (expected to fail without real OIDC setup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail without real GCP OIDC configuration
          # We just verify it ran and processed the workload_identity_provider and service_account inputs
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with workload_identity_provider and service_account inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
