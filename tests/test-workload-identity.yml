name: Test workload_identity_provider and service_account inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: auth
        uses: .
        continue-on-error: true
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          service_account: 'test-sa@my-test-project.iam.gserviceaccount.com'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
      - name: Assert action ran (inputs were accepted)
        env:
          OUTCOME: ${{ steps.auth.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with workload_identity_provider and service_account inputs"
