name: Test invalid credentials JSON error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid credentials_json (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          credentials_json: 'this-is-not-valid-json'

      - name: Assert action failed due to invalid credentials JSON
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials_json, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials_json"
