name: Test request_reason input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: auth
        uses: .
        continue-on-error: true
        with:
          request_reason: 'automated-test-run'
          credentials_json: '{"type":"service_account","project_id":"my-test-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABQGFGJCZbEKGnMRmSAP\nxDeHBt7FAKE\n-----END RSA PRIVATE KEY-----\n","client_email":"test@my-test-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
      - name: Assert action ran with request_reason input (fails gracefully without real creds)
        env:
          OUTCOME: ${{ steps.auth.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real GCP credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
