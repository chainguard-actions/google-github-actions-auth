name: Test credentials_json auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-test-project
          credentials_json: '{"type":"service_account","project_id":"my-test-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABQbXQMCMfIBBMBbKBaR\nFake key for testing only\n-----END RSA PRIVATE KEY-----\n","client_email":"test@my-test-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token","auth_provider_x509_cert_url":"https://www.googleapis.com/oauth2/v1/certs","client_x509_cert_url":"https://www.googleapis.com/robot/v1/metadata/x509/test%40my-test-project.iam.gserviceaccount.com"}'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
          token_format: ''
          request_reason: 'test-automation'
      - name: Assert action ran (expected to fail with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail with invalid/fake credentials
          # We just verify it ran and processed the inputs
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with credentials_json, project_id, and request_reason inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
