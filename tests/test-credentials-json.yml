name: Test credentials_json authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-test-project
          credentials_json: |
            {
              "type": "service_account",
              "project_id": "my-test-project",
              "private_key_id": "key-id",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA2a2rwplBQLF29amygykEMmYz0+Kcj3bKBp29P2rFj7yCEn9B\nFakeKeyForTestingPurposesOnly\n-----END RSA PRIVATE KEY-----\n",
              "client_email": "test@my-test-project.iam.gserviceaccount.com",
              "client_id": "123456789",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token"
            }
          create_credentials_file: 'false'
          export_environment_variables: 'false'
          request_reason: 'test-run'
          token_format: ''
      - name: Assert action ran (may fail with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail with invalid credentials,
          # but it should not be skipped or have an unexpected error type.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, invalid credentials expected to fail)"
