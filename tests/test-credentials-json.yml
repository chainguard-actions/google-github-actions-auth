name: Test credentials_json input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: auth
        uses: .
        continue-on-error: true
        with:
          project_id: my-test-project
          credentials_json: |
            {
              "type": "service_account",
              "project_id": "my-test-project",
              "private_key_id": "key-id",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA2a2rwplBQLzHPZe5RJr9vZPStCsFMHJAkMCFCFBHMJMBMBMB\n-----END RSA PRIVATE KEY-----\n",
              "client_email": "test@my-test-project.iam.gserviceaccount.com",
              "client_id": "123456789",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token"
            }
          request_reason: 'test-run'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
      - name: Assert action ran (inputs were accepted)
        env:
          OUTCOME: ${{ steps.auth.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with credentials_json, project_id, and request_reason inputs"
