name: Test invalid credentials_json format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          credentials_json: 'this-is-not-valid-json'
          create_credentials_file: 'false'
          export_environment_variables: 'false'
        continue-on-error: true
      - name: Assert action failed due to invalid JSON
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials_json"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials_json"
