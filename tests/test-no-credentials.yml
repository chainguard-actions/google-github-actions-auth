name: Test - No credentials provided (should fail with clear error)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: auth
        uses: .
        continue-on-error: true
        # Provide neither workload_identity_provider nor credentials_json
        # The action should fail with a clear error message

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.auth.outcome }}"
          if [ "${{ steps.auth.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no credentials provided"
            exit 1
          fi
          echo "PASS: action correctly failed when no credentials provided"
