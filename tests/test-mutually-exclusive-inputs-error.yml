name: Test mutually exclusive inputs error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with both workload_identity_provider and credentials_json (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          service_account: 'my-service-account@my-project.iam.gserviceaccount.com'
          credentials_json: '{"type":"service_account","project_id":"my-project"}'

      - name: Assert action failed due to mutually exclusive inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both workload_identity_provider and credentials_json are provided, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when mutually exclusive inputs were both provided"
