name: Test no authentication method provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-project
          create_credentials_file: 'false'
          export_environment_variables: 'false'

      - name: Assert action failed gracefully when no auth method provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no auth method is provided"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed without any authentication method"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
