name: Test fake service account key fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a fake RSA key for testing
        run: |
          # Generate a self-signed fake private key (not a real GCP key)
          openssl genrsa -out /tmp/fake-key.pem 2048 2>/dev/null
          PRIVATE_KEY=$(cat /tmp/fake-key.pem | awk 'NF {sub(/\r/, ""); printf "%s\\n",$0;}')
          # Build a structurally valid but fake service account JSON
          cat > /tmp/fake-sa.json <<EOF
          {
            "type": "service_account",
            "project_id": "fake-project-id",
            "private_key_id": "abc123def456abc123def456abc123def456abc1",
            "private_key": "$(cat /tmp/fake-key.pem | awk '{printf "%s\\n", $0}')",
            "client_email": "fake-sa@fake-project-id.iam.gserviceaccount.com",
            "client_id": "123456789012345678901",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token",
            "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
            "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/fake-sa%40fake-project-id.iam.gserviceaccount.com"
          }
          EOF
          echo "FAKE_SA_JSON=$(cat /tmp/fake-sa.json | tr -d '\n')" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          credentials_json: ${{ env.FAKE_SA_JSON }}
          create_credentials_file: 'false'
          export_environment_variables: 'false'
          token_format: ''

      - name: Assert action ran (succeeded with creds file or failed gracefully with fake key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROJECT_ID: ${{ steps.action.outputs.project_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "project_id: $PROJECT_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PROJECT_ID" ]; then
              echo "FAIL: action succeeded but project_id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded and project_id='$PROJECT_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with fake service account key (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
